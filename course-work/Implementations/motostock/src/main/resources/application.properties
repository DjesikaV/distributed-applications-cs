spring.application.name=motostock

spring.datasource.url=jdbc:postgresql://localhost:5432/motostock
spring.datasource.username=motostock_app
spring.datasource.password=${MOTOSTOCK_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.open-in-view=false