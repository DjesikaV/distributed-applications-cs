
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User Management - MotoStock</title>
</head>

<body>

<h1>User Management</h1>

<p th:if="${successMessage != null}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage != null}"
   th:text="${errorMessage}"
   role="alert"></p>

<p>
    <a th:href="@{/admin/users/new}">Create user</a>
</p>

<h3>Registered Users</h3>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Enabled</th>
        <th>Created At</th>
        <th>Change role</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="user : ${users}">

        <td th:text="${user.id()}"></td>

        <td th:text="${user.username()}"></td>

        <td th:text="${user.email()}"></td>

        <td th:text="${user.role()}"></td>

        <td th:text="${user.enabled() ? 'Yes' : 'No'}"></td>

        <td th:text="${user.createdAt()}"></td>

        <td>
    <span th:if="${user.username() == #authentication.name}">
        Your account
    </span>

            <form th:unless="${user.username() == #authentication.name}"
                  th:action="@{/admin/users/{id}/role(id=${user.id()})}"
                  method="post">

                <input type="hidden" name="page" th:value="${userPage.number}">
                <input type="hidden" name="size" th:value="${userPage.size}">

                <select name="role"
                        th:attr="aria-label=|Role for ${user.username()}|"
                        required>
                    <option th:each="role : ${roles}"
                            th:value="${role.name()}"
                            th:text="${role.name()}"
                            th:selected="${role == user.role()}">
                    </option>
                </select>

                <button type="submit">Save role</button>
            </form>
        </td>

    </tr>
    </tbody>
</table>

<p th:if="${users.isEmpty()}">
    No registered users found.
</p>

<div th:if="${userPage.totalPages > 0}">

    <p>
        Page
        <span th:text="${userPage.number + 1}"></span>
        of
        <span th:text="${userPage.totalPages}"></span>
    </p>

    <a th:if="${userPage.hasPrevious()}"
       th:href="@{/admin/users(
           page=${userPage.number - 1},
           size=${userPage.size}
       )}">
        Previous
    </a>

    <a th:if="${userPage.hasNext()}"
       th:href="@{/admin/users(
           page=${userPage.number + 1},
           size=${userPage.size}
       )}">
        Next
    </a>

</div>

<a th:href="@{/}">Back to Home</a>

</body>
</html>
