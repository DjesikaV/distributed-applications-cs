<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create User - MotoStock</title>
</head>

<body>

<h1>Create User</h1>

<form th:action="@{/admin/users}"
      th:object="${userForm}"
      method="post">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}"></p>
    </div>

    <div>
        <label for="username">Username:</label>

        <input type="text"
               id="username"
               th:field="*{username}"
               minlength="3"
               maxlength="50"
               required>

        <p th:if="${#fields.hasErrors('username')}"
           th:errors="*{username}"></p>
    </div>

    <div>
        <label for="email">Email:</label>

        <input type="email"
               id="email"
               th:field="*{email}"
               maxlength="120"
               required>

        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label for="password">Password:</label>

        <input type="password"
               id="password"
               name="password"
               autocomplete="new-password"
               minlength="8"
               maxlength="72"
               required>

        <p th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>
    </div>

    <div>
        <label for="role">Role:</label>

        <select id="role"
                th:field="*{role}"
                required>

            <option th:each="role : ${roles}"
                    th:value="${role.name()}"
                    th:text="${role.name()}">
            </option>

        </select>

        <p th:if="${#fields.hasErrors('role')}"
           th:errors="*{role}"></p>
    </div>

    <button type="submit">Create user</button>

</form>

<p>
    <a th:href="@{/admin/users}">Back to users</a>
</p>

</body>
</html>
