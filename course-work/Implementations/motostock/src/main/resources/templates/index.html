<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>MotoStock</title>
</head>
<body>
    <h1>Welcome to MotoStock</h1>

    <div sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </div>

    <div sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </div>

    <p>
        <a th:href="@{/parts}">Parts</a>
        <a th:href="@{/categories}">Categories</a>
        <a th:href="@{/suppliers}">Suppliers</a>
    </p>

    <div sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin/users}">
            Manage Users
        </a>
    </div>

    <p>
        Current user:
        <strong th:text="${username}">Guest</strong>
    </p>

    <p>
        Motorcycle Parts Inventory Management System
    </p>
</body>
</html>
