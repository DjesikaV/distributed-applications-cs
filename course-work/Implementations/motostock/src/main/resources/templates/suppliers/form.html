<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${supplierId != null} ? 'Edit Supplier MotoStock' : 'Create Supplier MotoStock'">
        Supplier - MotoStock
    </title>
</head>
<body>
<h1 th:text="${supplierId != null} ? 'Edit Supplier' : 'Create Supplier'">
    Create Supplier
</h1>
<form th:action="@{${supplierId != null ? '/suppliers/' + supplierId : '/suppliers'}}"
      th:object="${supplierForm}"
      method="POST">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
    <div>
        <label for="name">Name:</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               maxlength="100"
               required>

        <p th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}"></p>
    </div>

    <div>
        <label for="email">Email:</label>

        <input type="email"
               id="email"
               th:field="*{email}"
               maxlength="120">

        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label for="priority">Priority:</label>

        <input type="number"
               id="priority"
               th:field="*{priority}"
               step="1"
               required>

        <p th:if="${#fields.hasErrors('priority')}"
           th:errors="*{priority}"></p>
    </div>

    <div>
        <label for="active">Active:</label>

        <select id="active" th:field="*{active}" required>
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>

        <p th:if="${#fields.hasErrors('active')}"
           th:errors="*{active}"></p>
    </div>
    <button type="submit"
    th:text="${supplierId != null} ? 'Save Changes' : 'Create Supplier'">
        Create Supplier
    </button>
</form>
    <a th:href="@{/suppliers}">Back to Suppliers</a>
</body>
</html>
