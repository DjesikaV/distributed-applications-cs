<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <title>Suppliers - MotoStock</title>
</head>
<body>

<h1>Motorcycle Parts Suppliers</h1>

<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<a sec:authorize="hasRole('ADMIN')"
   th:href="@{/suppliers/new}">
    Add Supplier
</a>>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Priority</th>
        <th>Active</th>
        <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="supplier : ${suppliers}">
        <td th:text="${supplier.id}"></td>
        <td th:text="${supplier.name}"></td>
        <td th:text="${supplier.email}"></td>
        <td th:text="${supplier.priority}"></td>
        <td th:text="${supplier.active}"></td>

        <td sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">
                Edit
            </a>

        <form th:authorize="@{/suppliers/{id}/delete(id=${supplier.id})}"
                method="POST"
                style="display: inline"
                onsubmit="return confirm('Are you sure you want to delete this supplier?')">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">Delete</button>

        </form>
        </td>

    </tr>
    </tbody>
</table>
<p th:if="${supplier.isEmpty()}">
    No suppliers found
</p>
</body>
