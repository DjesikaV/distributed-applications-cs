<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <title>Suppliers - MotoStock</title>
</head>
<body>

<h1>Motorcycle Parts Suppliers</h1>

<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<a sec:authorize="hasRole('ADMIN')"
   th:href="@{/suppliers/new}">
    Add Supplier
</a>

<div sec:authorize="isAuthenticated()">

    <h3>Search Suppliers</h3>

    <form th:action="@{/suppliers/search}" method="get">

        <div>
            <label for="name">Supplier Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   th:value="${name}"
                   placeholder="Search by name..."
                   maxlength="100">
        </div>

        <div>
            <label for="email">Supplier Email:</label>
            <input type="text"
                   id="email"
                   name="email"
                   th:value="${email}"
                   placeholder="Search by email..."
                   maxlength="120">
        </div>

        <div>
            <label for="sort">Sort By:</label>
            <select id="sort" name="sort">
                <option value="name"
                        th:selected="${sort == null or sort == 'name'}">
                    Name
                </option>
                <option value="priority"
                        th:selected="${sort == 'priority'}">
                    Priority
                </option>
                <option value="createdAt"
                        th:selected="${sort == 'createdAt'}">
                    Creation Date
                </option>
            </select>
        </div>

        <div>
            <label for="direction">Direction:</label>
            <select id="direction" name="direction">
                <option value="asc"
                        th:selected="${direction == null or direction == 'asc'}">
                    Ascending
                </option>
                <option value="desc"
                        th:selected="${direction == 'desc'}">
                    Descending
                </option>
            </select>
        </div>

        <div>
            <label for="size">Records per page:</label>
            <select id="size" name="size">
                <option value="5"
                        th:selected="${size == 5}">5</option>
                <option value="10"
                        th:selected="${size == null or size == 10}">10</option>
                <option value="20"
                        th:selected="${size == 20}">20</option>
                <option value="50"
                        th:selected="${size == 50}">50</option>
            </select>
        </div>

        <input type="hidden" name="page" value="0">

        <button type="submit">Search</button>

        <a th:href="@{/suppliers/search}">Reset</a>

    </form>

</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Priority</th>
        <th>Active</th>
        <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="supplier : ${suppliers}">
        <td th:text="${supplier.id}"></td>
        <td th:text="${supplier.name}"></td>
        <td th:text="${supplier.email}"></td>
        <td th:text="${supplier.priority}"></td>
        <td th:text="${supplier.active}"></td>

        <td sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/suppliers/{id}/edit(id=${supplier.id})}">
                Edit
            </a>

        <form th:action="@{/suppliers/{id}/delete(id=${supplier.id})}"
                method="POST"
                style="display: inline"
                onsubmit="return confirm('Are you sure you want to delete this supplier?');">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">Delete</button>

        </form>
        </td>

    </tr>
    </tbody>
</table>

<div sec:authorize="isAuthenticated()"
     th:if="${supplierPage != null and supplierPage.totalPages > 0}">

    <p>
        Page
        <span th:text="${supplierPage.number + 1}"></span>
        of
        <span th:text="${supplierPage.totalPages}"></span>
    </p>

    <a th:if="${supplierPage.hasPrevious()}"
       th:href="@{/suppliers/search(
           name=${name},
           email=${email},
           sort=${sort},
           direction=${direction},
           size=${size},
           page=${supplierPage.number - 1}
       )}">
        Previous
    </a>

    <a th:if="${supplierPage.hasNext()}"
       th:href="@{/suppliers/search(
           name=${name},
           email=${email},
           sort=${sort},
           direction=${direction},
           size=${size},
           page=${supplierPage.number + 1}
       )}">
        Next
    </a>

</div>

<p th:if="${suppliers.isEmpty()}">
    No suppliers found
</p>
</body>
