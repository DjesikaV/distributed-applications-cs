
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register - MotoStock</title>
</head>

<body>

<h1>Create MotoStock Account</h1>

<form th:action="@{/register}"
      th:object="${registerForm}"
      method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error}"></p>
    </div>

    <div>
        <label for="username">Username:</label>

        <input type="text"
               id="username"
               th:field="*{username}"
               minlength="3"
               maxlength="50"
               required>

        <p th:if="${#fields.hasErrors('username')}"
           th:errors="*{username}"></p>
    </div>

    <div>
        <label for="email">Email:</label>

        <input type="email"
               id="email"
               th:field="*{email}"
               maxlength="120"
               required>

        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label for="password">Password:</label>

        <input type="password"
               id="password"
               th:field="*{password}"
               minlength="8"
               maxlength="72"
               required>

        <p th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"></p>
    </div>

    <button type="submit">Register</button>

</form>

<p>
    Already have an account?
    <a th:href="@{/login}">Login</a>
</p>

<a th:href="@{/}">Back to Home</a>

</body>
</html>
