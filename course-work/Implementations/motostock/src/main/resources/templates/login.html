
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <title>Login - MotoStock</title>
</head>

<body class="auth-page">

<header class="auth-header">
    <a class="brand" th:href="@{/}" aria-label="MotoStock home">
        <span class="brand-mark" aria-hidden="true"></span>
        MotoStock
    </a>
</header>

<main class="auth-main">
    <div class="auth-card">

<h1>Login to MotoStock</h1>
        <p role="status" th:if="${param.registered != null}">
            Registration successful! You can now log in.
        </p>

        <p role="alert" th:if="${param.error != null}">
            Invalid username or password.
        </p>

        <p role="status" th:if="${param.logout != null}">
            You have been logged out successfully.
        </p>

<form th:action="@{/login}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <div>
        <label for="username">Username:</label>

        <input type="text"
               id="username"
               name="username"
               required>
    </div>

    <div>
        <label for="password">Password:</label>

        <input type="password"
               id="password"
               name="password"
               required>
    </div>

    <button type="submit">Login</button>

</form>

<p>
    Don't have an account?
    <a th:href="@{/register}">Register here</a>
</p>

<a th:href="@{/}">Back to Home</a>

    </div>
</main>
</body>
</html>
