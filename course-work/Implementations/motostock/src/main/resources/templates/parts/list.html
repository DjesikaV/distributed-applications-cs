<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Parts - MotoStock</title>
</head>

<body>

<h1>Motorcycle Parts Inventory</h1>

<a sec:authorize="hasRole('ADMIN')"
   th:href="@{/parts/new}">
    Add Part
</a>


<div sec:authorize="isAuthenticated()">

    <h3>Search Motorcycle Parts</h3>

    <form th:action="@{/parts/search}" method="get">

        <div>
            <label for="name">Part Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   th:value="${name}"
                   placeholder="Search by part name..."
                   maxlength="120">
        </div>

        <div>
            <label for="sku">SKU:</label>
            <input type="text"
                   id="sku"
                   name="sku"
                   th:value="${sku}"
                   placeholder="Search by SKU..."
                   maxlength="40">
        </div>

        <div>
            <label for="sort">Sort By:</label>

            <select id="sort" name="sort">
                <option value="name"
                        th:selected="${sort == null or sort == 'name'}">
                    Name
                </option>

                <option value="sku"
                        th:selected="${sort == 'sku'}">
                    SKU
                </option>

                <option value="brand"
                        th:selected="${sort == 'brand'}">
                    Brand
                </option>

                <option value="quantity"
                        th:selected="${sort == 'quantity'}">
                    Quantity
                </option>

                <option value="purchasePrice"
                        th:selected="${sort == 'purchasePrice'}">
                    Purchase Price
                </option>

                <option value="sellingPrice"
                        th:selected="${sort == 'sellingPrice'}">
                    Selling Price
                </option>

                <option value="createdAt"
                        th:selected="${sort == 'createdAt'}">
                    Creation Date
                </option>
            </select>
        </div>

        <div>
            <label for="direction">Direction:</label>

            <select id="direction" name="direction">
                <option value="asc"
                        th:selected="${direction == null or direction == 'asc'}">
                    Ascending
                </option>

                <option value="desc"
                        th:selected="${direction == 'desc'}">
                    Descending
                </option>
            </select>
        </div>

        <div>
            <label for="size">Records per page:</label>

            <select id="size" name="size">
                <option value="5"
                        th:selected="${size == 5}">5</option>

                <option value="10"
                        th:selected="${size == null or size == 10}">10</option>

                <option value="20"
                        th:selected="${size == 20}">20</option>

                <option value="50"
                        th:selected="${size == 50}">50</option>
            </select>
        </div>

        <input type="hidden" name="page" value="0">

        <button type="submit">Search</button>

        <a th:href="@{/parts/search}">Reset</a>

    </form>

</div>


<p th:if="${successMessage}"
   th:text="${successMessage}"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"></p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>SKU</th>
        <th>Name</th>
        <th>Brand</th>
        <th>Category</th>
        <th>Supplier</th>
        <th>Quantity</th>
        <th>Purchase Price</th>
        <th>Selling Price</th>
        <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="part : ${parts}">

        <td th:text="${part.id}"></td>

        <td th:text="${part.sku}"></td>

        <td th:text="${part.name}"></td>

        <td th:text="${part.brand}"></td>

        <td th:text="${part.category.name}"></td>

        <td th:text="${part.supplier.name}"></td>

        <td th:text="${part.quantity}"></td>

        <td th:text="${part.purchasePrice}"></td>

        <td th:text="${part.sellingPrice}"></td>

        <td sec:authorize="hasRole('ADMIN')">

            <a th:href="@{/parts/{id}/edit(id=${part.id})}">
                Edit
            </a>

            <form th:action="@{/parts/{id}/delete(id=${part.id})}"
                  method="post"
                  style="display:inline"
                  onsubmit="return confirm('Are you sure you want to delete this part?');">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit">Delete</button>

            </form>

        </td>

    </tr>
    </tbody>
</table>


<div sec:authorize="isAuthenticated()"
     th:if="${partPage != null and partPage.totalPages > 0}">

    <p>
        Page
        <span th:text="${partPage.number + 1}"></span>
        of
        <span th:text="${partPage.totalPages}"></span>
    </p>

    <a th:if="${partPage.hasPrevious()}"
       th:href="@{/parts/search(
           name=${name},
           sku=${sku},
           sort=${sort},
           direction=${direction},
           size=${size},
           page=${partPage.number - 1}
       )}">
        Previous
    </a>

    <a th:if="${partPage.hasNext()}"
       th:href="@{/parts/search(
           name=${name},
           sku=${sku},
           sort=${sort},
           direction=${direction},
           size=${size},
           page=${partPage.number + 1}
       )}">
        Next
    </a>

</div>


<p th:if="${parts.isEmpty()}">
    No motorcycle parts found.
</p>

<a th:href="@{/}">Back to Home</a>

</body>
</html>
